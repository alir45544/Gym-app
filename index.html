<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدول تماريني</title>
<link rel="manifest" href="./manifest.json">
<style>
  :root {
    --bg: #0d0f12;
    --surface: #171a1f;
    --surface-2: #1f232a;
    --border: #2a2f38;
    --text: #eceef2;
    --muted: #8b93a1;
    --accent: #ff4d2e;
    --accent-2: #ff7a3d;
    --ok: #22c55e;
    --danger: #ef4444;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px 14px 110px;
    max-width: 720px;
    margin: 0 auto;
  }
  header { text-align: center; margin: 8px 0 14px; }
  header h1 { font-size: 1.5rem; letter-spacing: .5px; }
  header h1 span { color: var(--accent); }
  header p { color: var(--muted); font-size: .9rem; margin-top: 4px; }

  /* Main navigation */
  .nav { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 5px; margin-bottom: 14px; }
  .nav button {
    flex: 1; border: none; background: transparent; color: var(--muted);
    padding: 11px; border-radius: 10px; font-size: .95rem; font-family: inherit; font-weight: 600; cursor: pointer;
  }
  .nav button.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }

  /* Day tabs / filter chips */
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 10px 16px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--muted); font-size: .92rem; font-family: inherit; cursor: pointer; transition: .2s; position: relative;
  }
  .tab.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; font-weight: 600; }
  .tab.today::after { content: ""; position: absolute; top: 6px; left: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }

  /* Timer panel */
  .timer-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin: 8px 0 16px; text-align: center; }
  .timer { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 2px; direction: ltr; }
  .timer.running { color: var(--accent); }
  .progress { height: 8px; background: var(--surface-2); border-radius: 99px; margin: 12px 0 6px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .3s; }
  .progress-text { color: var(--muted); font-size: .85rem; }
  .rest-setting { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 12px; color: var(--muted); font-size: .88rem; }
  .rest-setting select {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-family: inherit; font-size: .9rem;
  }

  .btn { border: none; border-radius: 12px; padding: 13px 20px; font-size: 1rem; font-family: inherit; font-weight: 600; cursor: pointer; transition: .15s; color: #fff; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .6; }
  .btn-start { background: linear-gradient(135deg, var(--accent), var(--accent-2)); width: 100%; margin-top: 12px; }
  .btn-finish { background: var(--ok); width: 100%; margin-top: 12px; }
  .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }

  .section-head { display: flex; justify-content: space-between; align-items: center; margin: 6px 2px 12px; }
  .section-head h2 { font-size: 1.1rem; }
  .section-head small { color: var(--muted); }

  /* Exercise cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; transition: .2s; }
  .card.done { border-color: var(--ok); }
  .card.done .ex-name { color: var(--ok); }
  .card-top { display: flex; gap: 12px; align-items: center; }
  .ex-name { flex: 1; min-width: 0; font-size: 1.05rem; font-weight: 700; word-break: break-word; }
  .check {
    appearance: none; -webkit-appearance: none; width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    border: 2px solid var(--border); background: var(--surface-2); cursor: pointer; position: relative; transition: .15s;
  }
  .check:checked { background: var(--ok); border-color: var(--ok); }
  .check:checked::after { content: "✓"; color: #fff; position: absolute; inset: 0; display: grid; place-items: center; font-size: 19px; font-weight: 700; }
  .check.small { width: 26px; height: 26px; border-radius: 8px; }
  .check.small:checked::after { font-size: 16px; }
  .card-actions { display: flex; gap: 6px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 1rem; cursor: pointer; flex: 0 0 auto; }
  .icon-btn.del { color: var(--danger); }

  .sets { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .set {
    display: flex; align-items: center; gap: 10px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; font-size: .9rem; transition: .15s;
  }
  .set.done { opacity: .55; }
  .set.done .set-v, .set.done .set-w { text-decoration: line-through; }
  .set-n { color: var(--muted); min-width: 54px; }
  .set-v { flex: 1; }
  .set-w { color: var(--text); }
  .set b { color: var(--accent-2); }
  .note { color: var(--muted); font-size: .85rem; margin-top: 10px; line-height: 1.5; word-break: break-word; }

  .video-btn {
    margin-top: 12px; width: 100%; background: rgba(255,77,46,.12); border: 1px solid rgba(255,77,46,.4);
    color: var(--accent-2); border-radius: 10px; padding: 10px; font-family: inherit; font-size: .92rem;
    font-weight: 600; cursor: pointer;
  }

  .empty { text-align: center; color: var(--muted); padding: 36px 12px; border: 2px dashed var(--border); border-radius: var(--radius); }

  .fab {
    position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: 20px;
    width: 58px; height: 58px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff; font-size: 2rem; cursor: pointer; box-shadow: 0 8px 24px rgba(255, 77, 46, .4); z-index: 20;
  }

  /* Rest circle (appears only after finishing a set) */
  .rest {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) scale(.6); opacity: 0; pointer-events: none;
    transition: transform .25s, opacity .25s; z-index: 60;
    background: rgba(23,26,31,.97); border: 1px solid var(--border); border-radius: 28px;
    padding: 16px 18px 14px; box-shadow: 0 16px 40px rgba(0,0,0,.6); text-align: center;
  }
  .rest.show { transform: translateX(-50%) scale(1); opacity: 1; pointer-events: auto; }
  .ring { position: relative; width: 150px; height: 150px; margin: 0 auto 12px; }
  .ring svg { width: 100%; height: 100%; }
  .ring-bg { fill: none; stroke: var(--surface-2); stroke-width: 10; }
  .ring-fg { fill: none; stroke: var(--ok); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .25s linear, stroke .2s; }
  .rest.over .ring-fg { stroke: var(--accent-2); }
  .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring-center b { font-size: 2rem; font-variant-numeric: tabular-nums; direction: ltr; }
  .ring-center small { color: var(--muted); font-size: .85rem; margin-top: 2px; }
  .rest-btns { display: flex; gap: 8px; }
  .rest-btns button {
    flex: 1; border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    border-radius: 12px; padding: 10px 14px; font-family: inherit; font-size: .95rem; font-weight: 600; cursor: pointer;
  }
  .rest-btns #restSkip { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; }

  /* History page */
  .date-filter { display: flex; gap: 8px; align-items: center; margin: 2px 0 12px; }
  .date-filter label { color: var(--muted); font-size: .88rem; white-space: nowrap; }
  .date-filter input {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px; font-family: inherit; font-size: .95rem; color-scheme: dark;
  }
  .date-filter button {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 10px; padding: 10px 14px; font-family: inherit; font-size: .88rem; cursor: pointer;
  }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 6px; text-align: center; }
  .stat b { display: block; font-size: 1.4rem; color: var(--accent-2); direction: ltr; }
  .stat span { font-size: .78rem; color: var(--muted); }
  .del-all {
    width: 100%; margin-bottom: 12px; background: transparent; border: 1px solid var(--danger);
    color: var(--danger); border-radius: 10px; padding: 10px; font-family: inherit; font-size: .88rem; cursor: pointer;
  }
  .hist-hint { color: var(--muted); font-size: .8rem; margin: 0 2px 10px; }
  .hist-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .hist-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .hist-head .day { font-size: 1.05rem; font-weight: 700; }
  .hist-head .date { color: var(--muted); font-size: .82rem; margin-top: 2px; direction: ltr; text-align: right; }
  .hist-actions { display: flex; align-items: center; gap: 8px; }
  .dur { color: var(--accent-2); font-weight: 700; direction: ltr; font-variant-numeric: tabular-nums; margin-left: 2px; }
  .hist-sub { color: var(--muted); font-size: .85rem; margin: 8px 0 4px; }

  /* Collapsible (read-only) exercise in history */
  .hist-ex { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 10px; }
  .hist-ex summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .hist-ex summary::-webkit-details-marker { display: none; }
  .hist-ex summary .nm { flex: 1; font-weight: 700; font-size: .95rem; word-break: break-word; }
  .hist-ex summary .cnt { color: var(--muted); font-size: .8rem; }
  .hist-ex summary .chev { color: var(--muted); transition: transform .2s; }
  .hist-ex[open] summary .chev { transform: rotate(180deg); }
  .set-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .set-chip { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: .82rem; direction: rtl; }
  .set-chip.ok { border-color: rgba(34,197,94,.5); }
  .set-chip.skip { opacity: .4; }
  .set-chip b { color: var(--accent-2); }

  /* History edit */
  .hedit-ex { border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-bottom: 10px; background: var(--surface-2); }
  .hedit-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .hedit-head b { word-break: break-word; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: flex-end; justify-content: center; z-index: 50; }
  .overlay.open { display: flex; }
  .modal {
    background: var(--surface); width: 100%; max-width: 560px; border-radius: 22px 22px 0 0;
    padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px)); border: 1px solid var(--border);
    max-height: 92vh; overflow-y: auto;
  }
  .modal h3 { margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 5px; }
  .field input, .field textarea {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 12px; font-size: 1rem; font-family: inherit;
  }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .field small { display: block; color: var(--muted); font-size: .78rem; margin-top: 5px; }

  .file-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .file-btn {
    display: inline-block; background: var(--surface-2); border: 1px dashed var(--accent-2); color: var(--accent-2);
    border-radius: 10px; padding: 10px 14px; font-size: .9rem; font-weight: 600; cursor: pointer; margin: 0 !important;
  }
  .file-name { color: var(--muted); font-size: .82rem; word-break: break-all; flex: 1; min-width: 0; }
  .file-clear { background: none; border: 1px solid var(--border); color: var(--danger); border-radius: 8px; width: 32px; height: 32px; cursor: pointer; }

  .stepper { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .stepper .ctl { display: flex; align-items: center; gap: 12px; }
  .stepper .ctl button {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 1.3rem; cursor: pointer;
  }
  .stepper .ctl span { font-size: 1.2rem; font-weight: 700; min-width: 24px; text-align: center; }
  .set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .set-row .idx { width: 24px; text-align: center; color: var(--muted); font-size: .9rem; }
  .set-row input[type="text"], .set-row input:not([type]), .set-row input[inputmode] {
    flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 10px; padding: 11px; font-size: 1rem; font-family: inherit;
  }
  .set-row input:focus { outline: none; border-color: var(--accent); }
  .copy-link { background: none; border: none; color: var(--accent-2); font-family: inherit; font-size: .85rem; cursor: pointer; margin: 2px 0 14px; padding: 0; }
  .modal-actions { display: flex; gap: 10px; margin-top: 6px; }
  .modal-actions .btn { flex: 1; }

  /* Video modal */
  .v-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .v-head h3 { margin: 0; font-size: 1.05rem; word-break: break-word; }
  .v-frame { position: relative; width: 100%; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background: #000; }
  .v-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .v-video { width: 100%; border-radius: 12px; background: #000; max-height: 60vh; }
  .v-link {
    display: block; text-align: center; margin-top: 12px; padding: 11px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--accent-2);
    text-decoration: none; font-size: .92rem; font-weight: 600;
  }
  .v-hint { color: var(--muted); font-size: .78rem; text-align: center; margin-top: 8px; }

  @media (min-width: 640px) {
    .overlay { align-items: center; }
    .modal { border-radius: 22px; }
  }
</style>
</head>
<body>

<header>
  <h1>💪 جدول <span>تماريني</span></h1>
  <p id="todayLabel"></p>
</header>

<div class="nav" id="nav">
  <button class="active" data-view="workout">🏋️ التمرين</button>
  <button data-view="history">📊 السجل</button>
</div>

<!-- ================= Workout view ================= -->
<div id="viewWorkout">
  <div class="tabs" id="tabs"></div>

  <div class="timer-box">
    <div class="timer" id="timer">00:00:00</div>
    <div class="progress"><div id="bar"></div></div>
    <div class="progress-text" id="progressText">0 / 0 تمرين</div>
    <div class="rest-setting">
      <span>⏱ وقت الراحة بين الجولات:</span>
      <select id="restSelect">
        <option value="30">30 ثانية</option>
        <option value="45">45 ثانية</option>
        <option value="60">دقيقة</option>
        <option value="90">دقيقة ونص</option>
        <option value="120">دقيقتين</option>
        <option value="180">3 دقائق</option>
      </select>
    </div>
    <button class="btn btn-start" id="mainBtn">▶ بدء التمرين</button>
  </div>

  <div class="section-head">
    <h2 id="dayTitle"></h2>
    <small id="dayCount"></small>
  </div>
  <div id="list"></div>
</div>

<!-- ================= History view ================= -->
<div id="viewHistory" style="display:none">
  <div class="tabs" id="histTabs"></div>
  <div class="date-filter">
    <label for="histDate">📅 يوم محدد:</label>
    <input type="date" id="histDate">
    <button id="histDateClear">مسح</button>
  </div>
  <div class="stats" id="stats"></div>
  <button class="del-all" id="histDelAll" style="display:none"></button>
  <div class="hist-hint" id="histHint"></div>
  <div id="histList"></div>
</div>

<button class="fab" id="addBtn" aria-label="إضافة تمرين">+</button>

<!-- Rest circle: shows only after finishing a set -->
<div class="rest" id="rest">
  <div class="ring">
    <svg viewBox="0 0 120 120">
      <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
      <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="52" transform="rotate(-90 60 60)"></circle>
    </svg>
    <div class="ring-center"><b id="restTime">00:00</b><small id="restLabel">راحة</small></div>
  </div>
  <div class="rest-btns">
    <button id="restPlus">+15 ث</button>
    <button id="restSkip">تخطّي ⏭</button>
  </div>
</div>

<!-- Add / Edit exercise modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">إضافة تمرين</h3>
    <div class="field">
      <label>اسم التمرين</label>
      <input id="fName" placeholder="مثال: سكوات" maxlength="60">
    </div>

    <div class="stepper">
      <label style="color:var(--muted);font-size:.85rem">عدد الجولات</label>
      <div class="ctl">
        <button type="button" id="setMinus">−</button>
        <span id="setCount">3</span>
        <button type="button" id="setPlus">+</button>
      </div>
    </div>
    <div id="setRows"></div>
    <button type="button" class="copy-link" id="copyFirst">نسخ قيم الجولة الأولى لكل الجولات</button>

    <div class="field">
      <label>🎬 فيديو شرح التمرين (اختياري)</label>
      <input id="fVideo" type="url" inputmode="url" dir="ltr" placeholder="https://youtube.com/watch?v=...">
      <small>الصق رابط يوتيوب أو رابط فيديو مباشر، أو ارفع فيديو من جهازك:</small>
      <div class="file-row">
        <label class="file-btn" for="fFile">📁 رفع فيديو من الجهاز</label>
        <input type="file" id="fFile" accept="video/*" hidden>
        <span class="file-name" id="fFileName"></span>
        <button type="button" class="file-clear" id="fFileClear" hidden title="إزالة الفيديو">✕</button>
      </div>
    </div>

    <div class="field">
      <label>ملاحظات (اختياري)</label>
      <textarea id="fNotes" rows="3" maxlength="300" placeholder="مثال: ركّز على النزول البطيء"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelBtn">إلغاء</button>
      <button class="btn btn-start" id="saveBtn" style="margin-top:0">حفظ</button>
    </div>
  </div>
</div>

<!-- Video modal -->
<div class="overlay" id="vOverlay">
  <div class="modal">
    <div class="v-head">
      <h3 id="vTitle"></h3>
      <button class="icon-btn" id="vClose" aria-label="إغلاق">✕</button>
    </div>
    <div id="vBody"></div>
    <div id="vLinks"></div>
    <div class="v-hint" id="vHint"></div>
  </div>
</div>

<!-- History session edit modal -->
<div class="overlay" id="hOverlay">
  <div class="modal">
    <h3 id="hTitle">تعديل الجلسة</h3>
    <div id="hBody"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="hCancel">إلغاء</button>
      <button class="btn btn-start" id="hSave" style="margin-top:0">حفظ التعديلات</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // Show runtime errors on screen (helps debugging)
  function showError(msg) {
    const box = document.createElement("div");
    box.style.cssText = "position:fixed;top:0;left:0;right:0;background:#ef4444;color:#fff;padding:10px 14px;font:14px/1.4 sans-serif;z-index:999;direction:ltr";
    box.textContent = "Error: " + msg;
    document.body.appendChild(box);
  }
  window.addEventListener("error", e => showError(e.message + " (line " + e.lineno + ")"));
  window.addEventListener("unhandledrejection", e => showError(String((e.reason && e.reason.message) || e.reason)));

  // JS getDay() indexes: 0 = Sunday ... 6 = Saturday
  const DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
  // Display order: Saturday first
  const ORDER = [6, 0, 1, 2, 3, 4, 5];
  const KEY = "gymPlannerV1";

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  // ---------- IndexedDB (for uploaded videos) ----------
  const DB_NAME = "gymPlannerVideos", STORE = "videos";
  function idbOpen() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbPut(key, val) {
    const db = await idbOpen();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(val, key);
      tx.oncomplete = () => { db.close(); res(); };
      tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
    });
  }
  async function idbGet(key) {
    const db = await idbOpen();
    return new Promise((res, rej) => {
      const req = db.transaction(STORE, "readonly").objectStore(STORE).get(key);
      req.onsuccess = () => { db.close(); res(req.result); };
      req.onerror = () => { db.close(); rej(req.error); };
    });
  }
  async function idbDel(key) {
    const db = await idbOpen();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = () => { db.close(); res(); };
      tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
    });
  }

  // ---------- State ----------
  const defaultState = () => ({
    exercises: { 0:[],1:[],2:[],3:[],4:[],5:[],6:[] },
    progress: {},        // { exerciseId: [true,false,...] } one flag per set
    sessionStart: null,
    sessionDay: null,
    restSeconds: 60,
    history: []
  });

  function load() {
    let s = defaultState();
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) s = Object.assign(s, JSON.parse(raw));
    } catch (e) { console.warn("load failed", e); }
    for (let d = 0; d < 7; d++) {
      s.exercises[d] = (s.exercises[d] || []).map(ex => {
        if (Array.isArray(ex.sets)) return ex;
        const n = Math.max(1, parseInt(ex.sets) || 1);
        const sets = Array.from({ length: n }, () => ({ reps: ex.reps || "", weight: ex.weight || "" }));
        return { id: ex.id, name: ex.name, notes: ex.notes || "", sets };
      });
    }
    delete s.done;
    if (!s.progress) s.progress = {};
    s.history = (s.history || []).map(h => h.id ? h : Object.assign({}, h, { id: uid() }));
    return s;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { console.warn("save failed", e); }
  }

  let state = load();
  let selectedDay = new Date().getDay();
  let lastDateStr = new Date().toDateString();
  let view = "workout";
  let histFilter = -1;          // -1 = all weekdays, otherwise getDay() index
  let histDate = "";            // "" = no specific date, otherwise YYYY-MM-DD
  let editingId = null;
  let formSets = [];
  let tick = null;

  // Video form state
  let pendingFile = null;       // File chosen in the form
  let currentFile = null;       // existing videoFile meta of the exercise being edited
  let removeFile = false;
  let vObjUrl = null;

  // History edit working copy
  let editH = null;

  // Rest timer (not persisted)
  let rest = { end: 0, total: 0, timer: null, hideTimer: null };
  let audioCtx = null;
  const RING_C = 2 * Math.PI * 52;

  // ---------- Helpers ----------
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const pad = n => String(n).padStart(2, "0");
  const fmt = ms => {
    const s = Math.floor(ms / 1000);
    return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`;
  };
  const fmtMS = ms => {
    const s = Math.max(0, Math.ceil(ms / 1000));
    return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  };
  const fmtDate = ts => {
    const d = new Date(ts);
    return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}  ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dayKey = h => h.ts ? ymd(new Date(h.ts)) : "old:" + (h.date || h.id);
  const fmtTotal = ms => {
    const mins = Math.floor(ms / 60000);
    return `${Math.floor(mins / 60)}س ${mins % 60}د`;
  };
  const isRunning = () => state.sessionStart !== null;

  function getProg(ex) {
    const cur = Array.isArray(state.progress[ex.id]) ? state.progress[ex.id] : [];
    return ex.sets.map((_, i) => !!cur[i]);
  }
  const findEx = id => (state.exercises[selectedDay] || []).find(e => e.id === id);

  function centerActive(container) {
    const a = container.querySelector(".active");
    if (a && a.scrollIntoView) a.scrollIntoView({ inline: "center", block: "nearest" });
  }

  // ---------- Video helpers ----------
  function normalizeUrl(u) {
    u = (u || "").trim();
    if (!u) return "";
    if (!/^https?:\/\//i.test(u)) u = "https://" + u;
    try {
      const x = new URL(u);
      return (x.protocol === "http:" || x.protocol === "https:") ? x.href : "";
    } catch (e) { return ""; }
  }
  function parseVideo(url) {
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/|v\/))([\w-]{11})/i);
    if (m) return { type: "yt", id: m[1] };
    if (/\.(mp4|webm|ogg|mov|m4v)(\?|#|$)/i.test(url)) return { type: "file" };
    return { type: "link" };
  }
  function revokeVideoUrl() {
    if (vObjUrl) { URL.revokeObjectURL(vObjUrl); vObjUrl = null; }
  }

  async function openVideo(id) {
    const ex = findEx(id);
    if (!ex || !(ex.video || ex.videoFile)) return;
    $("vTitle").textContent = "🎬 " + ex.name;
    const urlLink = u => `<a class="v-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">فتح الرابط في تبويب جديد ↗</a>`;
    let body = "", links = "", hint = "";

    revokeVideoUrl();
    if (ex.videoFile) {
      try {
        const blob = await idbGet(ex.videoFile.key);
        if (!blob) throw new Error("missing");
        vObjUrl = URL.createObjectURL(blob);
        body = `<video class="v-video" controls playsinline src="${vObjUrl}"></video>`;
        links += `<a class="v-link" href="${vObjUrl}" download="${esc(ex.videoFile.name || "video.mp4")}">⬇ تنزيل الفيديو على جهازك</a>`;
      } catch (e) {
        body = `<div class="empty">ما قدرت أفتح الفيديو المحفوظ (ممكن انمسح من المتصفح)</div>`;
      }
      if (ex.video) links += urlLink(ex.video);
    } else {
      const v = parseVideo(ex.video);
      if (v.type === "yt") {
        body = `<div class="v-frame"><iframe
          src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0&playsinline=1"
          allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen"
          allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
        links += urlLink(ex.video);
        hint = "إذا ما اشتغل الفيديو هون، افتحه من الرابط اللي فوق";
      } else if (v.type === "file") {
        body = `<video class="v-video" controls playsinline src="${esc(ex.video)}"></video>`;
        links += `<a class="v-link" href="${esc(ex.video)}" download target="_blank" rel="noopener noreferrer">⬇ تنزيل الفيديو</a>`;
      } else {
        body = `<div class="empty">هالرابط ما بينعرض داخل الصفحة، افتحه من الزر تحت 👇</div>`;
        links += urlLink(ex.video);
      }
    }
    $("vBody").innerHTML = body;
    $("vLinks").innerHTML = links;
    $("vHint").textContent = hint;
    $("vOverlay").classList.add("open");
  }
  function closeVideo() {
    $("vBody").innerHTML = "";     // stops playback
    $("vLinks").innerHTML = "";
    revokeVideoUrl();
    $("vOverlay").classList.remove("open");
  }

  // ---------- Render: workout ----------
  function renderTabs() {
    const today = new Date().getDay();
    $("tabs").innerHTML = ORDER.map(i =>
      `<button class="tab ${i === selectedDay ? "active" : ""} ${i === today ? "today" : ""}" data-day="${i}">${DAYS[i]}</button>`
    ).join("");
    centerActive($("tabs"));
  }

  function cardHTML(ex) {
    const p = getProg(ex);
    const all = p.length > 0 && p.every(Boolean);
    const rows = ex.sets.map((s, i) => `
      <div class="set ${p[i] ? "done" : ""}">
        <input type="checkbox" class="check small" data-act="set" data-i="${i}" ${p[i] ? "checked" : ""}>
        <span class="set-n">جولة ${i + 1}</span>
        <span class="set-v"><b>${esc(s.reps || "—")}</b> تكرار</span>
        <span class="set-w">${s.weight ? `<b>${esc(s.weight)}</b> كغ` : "—"}</span>
      </div>`).join("");
    return `
    <div class="card ${all ? "done" : ""}" data-id="${ex.id}">
      <div class="card-top">
        <input type="checkbox" class="check" data-act="all" ${all ? "checked" : ""} title="تم إنجاز التمرين كله">
        <div class="ex-name">${esc(ex.name)}</div>
        <div class="card-actions">
          <button class="icon-btn" data-act="edit" title="تعديل">✎</button>
          <button class="icon-btn del" data-act="delete" title="حذف">🗑</button>
        </div>
      </div>
      <div class="sets">${rows}</div>
      ${(ex.video || ex.videoFile) ? `<button class="video-btn" data-act="video">▶ شاهد طريقة الأداء</button>` : ""}
      ${ex.notes ? `<div class="note">📝 ${esc(ex.notes)}</div>` : ""}
    </div>`;
  }

  function renderList() {
    const list = state.exercises[selectedDay] || [];
    $("dayTitle").textContent = `تمارين ${DAYS[selectedDay]}`;
    $("dayCount").textContent = `${list.length} تمرين`;
    $("list").innerHTML = list.length
      ? list.map(cardHTML).join("")
      : `<div class="empty">ما في تمارين لهاليوم بعد 🏋️<br>اضغط على زر + لإضافة أول تمرين</div>`;
    updateProgress();
  }

  function updateProgress() {
    const list = state.exercises[selectedDay] || [];
    const doneCount = list.filter(e => { const p = getProg(e); return p.length && p.every(Boolean); }).length;
    $("bar").style.width = (list.length ? (doneCount / list.length) * 100 : 0) + "%";
    $("progressText").textContent = `${doneCount} / ${list.length} تمرين`;
  }

  function renderTimerUI() {
    const running = isRunning();
    const btn = $("mainBtn");
    btn.className = "btn " + (running ? "btn-finish" : "btn-start");
    btn.textContent = running ? "■ إنهاء التمرين" : "▶ بدء التمرين";
    $("timer").classList.toggle("running", running);
    $("timer").textContent = running ? fmt(Date.now() - state.sessionStart) : "00:00:00";
  }

  // ---------- Render: history ----------
  function renderHistTabs() {
    const items = [{ i: -1, n: "الكل" }].concat(ORDER.map(i => ({ i, n: DAYS[i] })));
    $("histTabs").innerHTML = items.map(x =>
      `<button class="tab ${x.i === histFilter ? "active" : ""}" data-hday="${x.i}">${x.n}</button>`
    ).join("");
    centerActive($("histTabs"));
  }

  function getHistFiltered() {
    let list = state.history || [];
    if (histFilter !== -1) list = list.filter(h => h.dayName === DAYS[histFilter]);
    if (histDate) list = list.filter(h => h.ts && ymd(new Date(h.ts)) === histDate);
    return list;
  }

  function renderHistory() {
    renderHistTabs();
    const list = getHistFiltered();
    const filtered = histFilter !== -1 || !!histDate;

    const trainingDays = new Set(list.map(dayKey)).size;
    const totalMs = list.reduce((a, h) => a + (h.duration || 0), 0);
    $("stats").innerHTML = `
      <div class="stat"><b>${trainingDays}</b><span>أيام تمرين</span></div>
      <div class="stat"><b>${list.length}</b><span>جلسة</span></div>
      <div class="stat"><b>${fmtTotal(totalMs)}</b><span>إجمالي الوقت</span></div>`;

    const delAll = $("histDelAll");
    delAll.style.display = (filtered && list.length) ? "" : "none";
    delAll.textContent = `🗑 حذف كل الجلسات المعروضة (${list.length})`;

    const hasDetails = list.some(h => (h.exercises || []).length);
    $("histHint").textContent = hasDetails ? "اضغط على اسم التمرين لعرض تفاصيله، واستخدم ✎ إذا بدك تعدّل الجلسة." : "";

    if (!list.length) {
      $("histList").innerHTML = `<div class="empty">ما في جلسات ${filtered ? "بهالفلتر" : "محفوظة"} 📭<br>${filtered ? "جرّب يوم ثاني أو اضغط \"الكل\"" : "خلّص تمرين واضغط \"إنهاء التمرين\" لتنحفظ هون"}</div>`;
      return;
    }

    $("histList").innerHTML = list.map(h => {
      const exHTML = (h.exercises || []).map(ex => {
        const dn = ex.sets.filter(s => s.done).length;
        const full = ex.sets.length > 0 && dn === ex.sets.length;
        return `
        <details class="hist-ex">
          <summary>
            <span>${full ? "✅" : "◐"}</span>
            <span class="nm">${esc(ex.name)}</span>
            <span class="cnt">${dn}/${ex.sets.length} جولات</span>
            <span class="chev">⌄</span>
          </summary>
          <div class="set-chips">
            ${ex.sets.map((s, i) => `
              <span class="set-chip ${s.done ? "ok" : "skip"}">${s.done ? "✓" : "✗"} ${i + 1}: <b>${esc(s.reps || "—")}</b> تكرار${s.weight ? ` × <b>${esc(s.weight)}</b> كغ` : ""}</span>`).join("")}
          </div>
        </details>`;
      }).join("");
      const dateStr = h.ts ? fmtDate(h.ts) : (h.date || "");
      return `
      <div class="hist-card" data-hid="${esc(h.id)}">
        <div class="hist-head">
          <div>
            <div class="day">${esc(h.dayName)}</div>
            <div class="date">${esc(dateStr)}</div>
          </div>
          <div class="hist-actions">
            <div class="dur">${fmt(h.duration || 0)}</div>
            <button class="icon-btn" data-act="hedit" title="تعديل الجلسة">✎</button>
            <button class="icon-btn del" data-act="hdel" title="حذف الجلسة">🗑</button>
          </div>
        </div>
        <div class="hist-sub">${h.done} / ${h.total} تمرين مكتمل</div>
        ${exHTML}
      </div>`;
    }).join("");
  }

  function renderAll() {
    $("todayLabel").textContent = `اليوم: ${DAYS[new Date().getDay()]}`;
    renderTabs(); renderList(); renderTimerUI();
    if (view === "history") renderHistory();
    $("restSelect").value = String(state.restSeconds || 60);
  }

  function setView(v) {
    view = v;
    $("viewWorkout").style.display = v === "workout" ? "" : "none";
    $("viewHistory").style.display = v === "history" ? "" : "none";
    $("addBtn").style.display = v === "workout" ? "" : "none";
    document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.view === v));
    if (v === "history") renderHistory(); else renderTabs();
  }

  // ---------- History edit ----------
  function openHistEdit(id) {
    const h = state.history.find(x => x.id === id);
    if (!h) return;
    editH = JSON.parse(JSON.stringify(h));
    renderHistEdit();
    $("hOverlay").classList.add("open");
  }
  function closeHistEdit() { $("hOverlay").classList.remove("open"); editH = null; }

  function renderHistEdit() {
    const h = editH;
    $("hTitle").textContent = `تعديل جلسة ${h.dayName}`;
    const mins = Math.round((h.duration || 0) / 60000);
    let html = `<div class="field"><label>مدة الجلسة (بالدقائق)</label>
      <input id="hDur" type="number" min="0" inputmode="numeric" value="${mins}"></div>`;
    const exs = Array.isArray(h.exercises) ? h.exercises : [];
    if (!exs.length) html += `<div class="empty" style="padding:18px">هالجلسة ما فيها تفاصيل تمارين</div>`;
    exs.forEach((ex, xi) => {
      html += `<div class="hedit-ex">
        <div class="hedit-head"><b>${esc(ex.name)}</b>
          <button type="button" class="icon-btn del" data-act="hxdel" data-xi="${xi}" title="حذف التمرين من الجلسة">🗑</button></div>`;
      ex.sets.forEach((s, si) => {
        html += `<div class="set-row">
          <input type="checkbox" class="check small" data-act="hsdone" data-xi="${xi}" data-si="${si}" ${s.done ? "checked" : ""}>
          <span class="idx">${si + 1}</span>
          <input type="text" data-hk="reps" data-xi="${xi}" data-si="${si}" placeholder="تكرار" value="${esc(s.reps || "")}" inputmode="numeric" maxlength="10">
          <input type="text" data-hk="weight" data-xi="${xi}" data-si="${si}" placeholder="وزن (كغ)" value="${esc(s.weight || "")}" inputmode="decimal" maxlength="10">
        </div>`;
      });
      html += `</div>`;
    });
    $("hBody").innerHTML = html;
  }

  function saveHistEdit() {
    if (!editH) return;
    const h = editH;
    if (Array.isArray(h.exercises)) {
      h.exercises = h.exercises.filter(ex => ex.sets && ex.sets.length);
      h.done = h.exercises.filter(ex => ex.sets.every(s => s.done)).length;
      h.total = Math.max(h.total || 0, h.exercises.length);
    }
    const i = state.history.findIndex(x => x.id === h.id);
    if (i > -1) state.history[i] = h;
    save(); closeHistEdit(); renderHistory();
  }

  // ---------- Rest timer (circle) ----------
  function ensureAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) {}
  }
  function beep() {
    try {
      ensureAudio();
      [0, 0.22, 0.44].forEach(t => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = "sine"; o.frequency.value = 880;
        g.gain.setValueAtTime(0.0001, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.35, audioCtx.currentTime + t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + t + 0.18);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.2);
      });
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
  }

  function setRing(fraction) {            // fraction = time left / total (1 → 0)
    $("ringFg").style.strokeDashoffset = String(RING_C * (1 - fraction));
  }

  function startRest() {
    ensureAudio();
    stopRest(true);
    const ms = (state.restSeconds || 60) * 1000;
    rest.total = ms;
    rest.end = Date.now() + ms;
    $("rest").classList.remove("over");
    $("restLabel").textContent = "راحة";
    $("rest").classList.add("show");
    setRing(1);
    updateRest();
    rest.timer = setInterval(updateRest, 250);
  }

  function updateRest() {
    const left = rest.end - Date.now();
    if (left <= 0) {
      clearInterval(rest.timer); rest.timer = null;
      $("restTime").textContent = "00:00";
      $("rest").classList.add("over");
      $("restLabel").textContent = "يلا! 💪";
      setRing(1);
      beep();
      rest.hideTimer = setTimeout(() => $("rest").classList.remove("show"), 2500);
      return;
    }
    $("restTime").textContent = fmtMS(left);
    setRing(left / rest.total);
  }

  function stopRest(silent) {
    if (rest.timer) clearInterval(rest.timer);
    if (rest.hideTimer) clearTimeout(rest.hideTimer);
    rest.timer = null; rest.hideTimer = null;
    if (!silent) $("rest").classList.remove("show");
  }

  // ---------- Set / exercise completion ----------
  function setDone(id, i, checked) {
    const ex = findEx(id); if (!ex) return;
    const p = getProg(ex);
    p[i] = checked;
    state.progress[id] = p;
    save(); renderList();
    const remaining = p.some(v => !v);
    if (checked && remaining) startRest();     // circle appears only if more sets are left
    else stopRest();
  }

  function allDone(id, checked) {
    const ex = findEx(id); if (!ex) return;
    state.progress[id] = ex.sets.map(() => checked);
    save(); renderList();
    stopRest();
  }

  // ---------- Workout session ----------
  function startTicking() {
    if (tick) clearInterval(tick);
    tick = setInterval(() => {
      if (isRunning()) $("timer").textContent = fmt(Date.now() - state.sessionStart);
      checkNewDay();
    }, 1000);
  }

  function startWorkout() {
    state.sessionStart = Date.now();
    state.sessionDay = selectedDay;
    save(); renderTimerUI();
  }

  function finishWorkout() {
    if (!confirm("هل تريد إنهاء التمرين وحفظ الجلسة بالسجل؟")) return;
    const day = state.sessionDay ?? selectedDay;
    const plan = state.exercises[day] || [];
    const performed = [];
    let fullyDone = 0;

    plan.forEach(ex => {
      const p = Array.isArray(state.progress[ex.id]) ? state.progress[ex.id] : [];
      const sets = ex.sets.map((s, i) => ({ reps: s.reps, weight: s.weight, done: !!p[i] }));
      const anyDone = sets.some(s => s.done);
      if (sets.length && sets.every(s => s.done)) fullyDone++;
      if (anyDone) performed.push({ name: ex.name, sets });
    });

    state.history.unshift({
      id: uid(),
      ts: state.sessionStart,
      dayName: DAYS[day],
      duration: Date.now() - state.sessionStart,
      done: fullyDone,
      total: plan.length,
      exercises: performed
    });
    state.history = state.history.slice(0, 200);

    plan.forEach(ex => delete state.progress[ex.id]);
    state.sessionStart = null;
    state.sessionDay = null;
    stopRest();
    save(); renderAll();
  }

  function checkNewDay() {
    const now = new Date().toDateString();
    if (now !== lastDateStr) {
      lastDateStr = now;
      if (!isRunning()) selectedDay = new Date().getDay();
      renderAll();
    }
  }

  // ---------- Add / edit exercise modal ----------
  function renderSetRows() {
    $("setCount").textContent = formSets.length;
    $("setRows").innerHTML = formSets.map((s, i) => `
      <div class="set-row">
        <span class="idx">${i + 1}</span>
        <input type="text" data-k="reps" data-i="${i}" placeholder="تكرار" value="${esc(s.reps)}" inputmode="numeric" maxlength="10">
        <input type="text" data-k="weight" data-i="${i}" placeholder="وزن (كغ)" value="${esc(s.weight)}" inputmode="decimal" maxlength="10">
      </div>`).join("");
  }

  function renderFileLabel() {
    const name = pendingFile ? pendingFile.name : (currentFile && !removeFile ? currentFile.name : "");
    $("fFileName").textContent = name ? "📎 " + name : "";
    $("fFileClear").hidden = !name;
  }

  function openModal(id = null) {
    editingId = id;
    const ex = id ? findEx(id) : null;
    $("modalTitle").textContent = ex ? "تعديل التمرين" : `إضافة تمرين ليوم ${DAYS[selectedDay]}`;
    $("fName").value = ex ? ex.name : "";
    $("fNotes").value = ex ? (ex.notes || "") : "";
    $("fVideo").value = ex ? (ex.video || "") : "";
    $("fVideo").style.borderColor = "";
    pendingFile = null; removeFile = false;
    currentFile = ex && ex.videoFile ? ex.videoFile : null;
    renderFileLabel();
    formSets = ex
      ? ex.sets.map(s => ({ reps: s.reps, weight: s.weight }))
      : [{ reps: "12", weight: "" }, { reps: "10", weight: "" }, { reps: "10", weight: "" }];
    renderSetRows();
    $("overlay").classList.add("open");
    setTimeout(() => $("fName").focus(), 50);
  }
  function closeModal() { $("overlay").classList.remove("open"); editingId = null; }

  async function saveExercise() {
    const name = $("fName").value.trim();
    if (!name) { $("fName").focus(); $("fName").style.borderColor = "var(--danger)"; return; }
    $("fName").style.borderColor = "";

    const rawVideo = $("fVideo").value.trim();
    const video = normalizeUrl(rawVideo);
    if (rawVideo && !video) {
      $("fVideo").style.borderColor = "var(--danger)";
      $("fVideo").focus();
      return;
    }
    $("fVideo").style.borderColor = "";

    const btn = $("saveBtn");
    const oldText = btn.textContent;
    btn.disabled = true; btn.textContent = "جاري الحفظ...";
    try {
      let videoFile = currentFile;
      if (pendingFile) {
        const key = uid();
        await idbPut(key, pendingFile);
        if (currentFile) { try { await idbDel(currentFile.key); } catch (e) {} }
        videoFile = { key, name: pendingFile.name, type: pendingFile.type, size: pendingFile.size };
      } else if (removeFile) {
        if (currentFile) { try { await idbDel(currentFile.key); } catch (e) {} }
        videoFile = null;
      }

      const sets = formSets.map(s => ({ reps: String(s.reps).trim(), weight: String(s.weight).trim() }));
      const notes = $("fNotes").value.trim();
      const list = state.exercises[selectedDay];
      if (editingId) {
        const i = list.findIndex(e => e.id === editingId);
        if (i > -1) list[i] = { ...list[i], name, sets, notes, video, videoFile };
      } else {
        list.push({ id: uid(), name, sets, notes, video, videoFile });
      }
      save(); closeModal(); renderList();
    } catch (e) {
      console.error(e);
      alert("تعذّر حفظ الفيديو على هالجهاز. جرّب فيديو أصغر أو استخدم رابط.");
    } finally {
      btn.disabled = false; btn.textContent = oldText;
    }
  }

  function deleteExercise(id) {
    if (!confirm("متأكد بدك تحذف هالتمرين؟")) return;
    const ex = findEx(id);
    if (ex && ex.videoFile) idbDel(ex.videoFile.key).catch(() => {});
    state.exercises[selectedDay] = state.exercises[selectedDay].filter(e => e.id !== id);
    delete state.progress[id];
    save(); renderList();
  }

  // ---------- Events ----------
  $("nav").addEventListener("click", e => {
    const b = e.target.closest("button"); if (b) setView(b.dataset.view);
  });

  $("tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    selectedDay = +t.dataset.day;
    renderTabs(); renderList();
  });

  // History filters
  $("histTabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    histFilter = +t.dataset.hday;
    renderHistory();
  });
  $("histDate").addEventListener("change", e => { histDate = e.target.value; renderHistory(); });
  $("histDateClear").addEventListener("click", () => {
    histDate = ""; $("histDate").value = ""; renderHistory();
  });

  // History: edit / delete a session
  $("histList").addEventListener("click", e => {
    const btn = e.target.closest("[data-act]"); if (!btn) return;
    const card = btn.closest(".hist-card"); if (!card) return;
    const id = card.dataset.hid;
    if (btn.dataset.act === "hedit") { openHistEdit(id); return; }
    if (btn.dataset.act === "hdel") {
      const h = state.history.find(x => x.id === id); if (!h) return;
      const when = h.ts ? fmtDate(h.ts) : (h.date || "");
      if (!confirm(`هل تريد حذف جلسة يوم ${h.dayName} (${when})؟`)) return;
      state.history = state.history.filter(x => x.id !== id);
      save(); renderHistory();
    }
  });

  $("histDelAll").addEventListener("click", () => {
    const list = getHistFiltered(); if (!list.length) return;
    if (!confirm(`هل تريد حذف ${list.length} جلسة معروضة؟ ما في رجعة عن هالخطوة.`)) return;
    const ids = new Set(list.map(h => h.id));
    state.history = state.history.filter(h => !ids.has(h.id));
    save(); renderHistory();
  });

  // History edit modal
  $("hBody").addEventListener("input", e => {
    if (!editH) return;
    const t = e.target;
    if (t.id === "hDur") { editH.duration = Math.max(0, parseFloat(t.value) || 0) * 60000; return; }
    const k = t.dataset.hk; if (!k) return;
    editH.exercises[+t.dataset.xi].sets[+t.dataset.si][k] = t.value;
  });
  $("hBody").addEventListener("click", e => {
    if (!editH) return;
    const t = e.target.closest("[data-act]"); if (!t) return;
    if (t.dataset.act === "hsdone") {
      editH.exercises[+t.dataset.xi].sets[+t.dataset.si].done = t.checked;
    } else if (t.dataset.act === "hxdel") {
      if (!confirm("حذف هالتمرين من الجلسة؟")) return;
      editH.exercises.splice(+t.dataset.xi, 1);
      renderHistEdit();
    }
  });
  $("hSave").addEventListener("click", saveHistEdit);
  $("hCancel").addEventListener("click", closeHistEdit);

  // Exercise cards
  $("list").addEventListener("click", e => {
    const act = e.target.dataset.act;
    const card = e.target.closest(".card");
    if (!act || !card) return;
    const id = card.dataset.id;
    if (act === "set") setDone(id, +e.target.dataset.i, e.target.checked);
    else if (act === "all") allDone(id, e.target.checked);
    else if (act === "edit") openModal(id);
    else if (act === "delete") deleteExercise(id);
    else if (act === "video") openVideo(id);
  });

  $("mainBtn").addEventListener("click", () => isRunning() ? finishWorkout() : startWorkout());
  $("addBtn").addEventListener("click", () => openModal());
  $("saveBtn").addEventListener("click", saveExercise);
  $("cancelBtn").addEventListener("click", closeModal);
  $("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closeModal(); });
  $("vOverlay").addEventListener("click", e => { if (e.target.id === "vOverlay") closeVideo(); });
  $("vClose").addEventListener("click", closeVideo);
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { closeModal(); closeVideo(); closeHistEdit(); }
  });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) { checkNewDay(); if (rest.timer) updateRest(); }
  });

  // Exercise modal: sets editor
  $("setRows").addEventListener("input", e => {
    const i = e.target.dataset.i, k = e.target.dataset.k;
    if (i === undefined || !k) return;
    formSets[+i][k] = e.target.value;
  });
  $("setPlus").addEventListener("click", () => {
    if (formSets.length >= 12) return;
    const last = formSets[formSets.length - 1] || { reps: "", weight: "" };
    formSets.push({ reps: last.reps, weight: last.weight });
    renderSetRows();
  });
  $("setMinus").addEventListener("click", () => {
    if (formSets.length <= 1) return;
    formSets.pop(); renderSetRows();
  });
  $("copyFirst").addEventListener("click", () => {
    const f = formSets[0];
    formSets = formSets.map(() => ({ reps: f.reps, weight: f.weight }));
    renderSetRows();
  });

  // Exercise modal: video upload
  $("fFile").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    if (f.size > 300 * 1024 * 1024 &&
        !confirm(`الفيديو كبير (${Math.round(f.size / 1048576)} ميغا) وممكن ياخد مساحة كبيرة بالمتصفح. بدك تكمّل؟`)) return;
    pendingFile = f; removeFile = false;
    renderFileLabel();
  });
  $("fFileClear").addEventListener("click", () => {
    pendingFile = null;
    removeFile = !!currentFile;
    renderFileLabel();
  });

  // Rest controls
  $("restSelect").addEventListener("change", e => {
    state.restSeconds = +e.target.value; save();
  });
  $("restSkip").addEventListener("click", () => stopRest());
  $("restPlus").addEventListener("click", () => {
    if (!rest.timer) return;
    rest.end += 15000; rest.total += 15000; updateRest();
  });

  // ---------- Init ----------
  $("ringFg").style.strokeDasharray = String(RING_C);
  if (isRunning() && state.sessionDay !== null) selectedDay = state.sessionDay;
  renderAll();
  setView("workout");
  startTicking();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
  }
</script>
</body>
</html>
